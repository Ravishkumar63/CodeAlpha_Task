<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">Image Gallery</h1>

    <div class="filter-buttons">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('animals')">Animals</button>
        <button onclick="filterImages('city')">City</button>
    </div>

    <div class="gallery">
        <img src="img1.jpg" class="image nature" onclick="openLightbox(0)">
        <img src="img2.jpg" class="image animals" onclick="openLightbox(1)">
        <img src="img3.jpg" class="image city" onclick="openLightbox(2)">
        <img src="img4.jpg" class="image nature" onclick="openLightbox(3)">
        <img src="img5.jpg" class="image animals" onclick="openLightbox(4)">
        <img src="img6.jpg" class="image city" onclick="openLightbox(5)">
    </div>

    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" class="lightbox-img">
        <button class="nav prev" onclick="prevImage()">&#10094;</button>
        <button class="nav next" onclick="nextImage()">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
